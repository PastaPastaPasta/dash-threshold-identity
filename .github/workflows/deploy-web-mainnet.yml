name: Deploy the hosted app (signed release)

# The only CI deploy of the hosted page. The page serves every network, Mainnet included,
# so every deploy of it needs a release Pasta signed (docs/MAINNET-GUARDRAILS.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: web-mainnet

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: web-mainnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Refuse files that change how npm or wrangler behave
        run: |
          if git ls-files | grep -E '(^|/)(\.env[^/]*|\.npmrc|npm-shrinkwrap\.json|\.dev\.vars)$|(^|/)node_modules/'; then echo 'remove these files'; exit 1; fi
      - run: npm ci --ignore-scripts
      - run: npm run web:build
      - name: Check the README publishes this build
        run: node web/verify.mjs --readme
      - name: Refuse a build that Pasta has not signed
        run: node web/release.mjs check
      - run: npx wrangler deploy --config web/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_BASE_URL: https://api.cloudflare.com/client/v4
      - name: Verify the live site against this build
        run: for i in 1 2 3 4 5; do node web/verify.mjs https://multisig.dashhq.org && exit 0; sleep 20; done; exit 1
