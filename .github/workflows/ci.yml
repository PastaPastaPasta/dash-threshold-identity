name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the relay Worker
        run: npx wrangler deploy --config relay/wrangler.toml --dry-run --outdir dist
      - name: Build the hosted testnet web app
        run: npm run web:build
      - name: Build the web Worker
        run: npx wrangler deploy --config web/wrangler.toml --dry-run --outdir dist-web
