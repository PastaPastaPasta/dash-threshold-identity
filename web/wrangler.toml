name = "dti-multisig-testnet"
main = "worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [
  { pattern = "multisig.dashhq.org", custom_domain = true },
  { pattern = "new-multisig.dashhq.org", custom_domain = true },
]

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Limits"]
